name: Release

# A merge of release/x.y.z or hotfix/x.y.z into main: validate, deliver, then tag and publish.
# Tagging happens here, not in a tag-triggered workflow: a tag pushed with GITHUB_TOKEN triggers nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Releases run one after another; queued ones wait instead of being dropped. Never cancel a delivery.
  group: release
  queue: max

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        name: Check version, changelog and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version $version"; exit 1; }
          node scripts/validate-changelog.mjs "$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::error::Tag v$version already exists. Bump the version in a release or hotfix branch."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deliver:
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deployment is manual (see docs/release.md): this job only proves the release builds for production.
      - name: Production build
        run: node ace build

  publish:
    needs: [version, deliver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" -f message="Release $VERSION" -f object="$GITHUB_SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_sha" --silent
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md
          echo "Released [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
