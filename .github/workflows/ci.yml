name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PRs cancel their own older runs; any other run (release.yml calling this) gets a unique group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-git-flow.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab # 16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voyager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for the test database and env validation (start/env.ts); not secrets.
    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-only-not-a-secret-0123456789abcdef
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: voyager_test
      SESSION_DRIVER: memory
      MAIL_FROM_NAME: Voyager CI
      MAIL_FROM_ADDRESS: ci@voyager.test
      SMTP_HOST: localhost
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Later steps run even when an earlier check fails, so one run reports every failure.
      - run: npm run lint --if-present
      - if: ${{ !cancelled() }}
        run: npm run typecheck --if-present
      # Tests expect a migrated database, as in the CONTRIBUTING.md setup.
      - if: ${{ !cancelled() }}
        run: node ace migration:run --force
      - if: ${{ !cancelled() }}
        run: npm run test --if-present
      - if: ${{ !cancelled() }}
        run: npm run build --if-present
      - if: ${{ !cancelled() }}
        run: npm run validate:changelog
